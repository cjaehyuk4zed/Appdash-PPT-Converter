services:
  converter:
    build: .
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      CONVERTER_ALLOWED_HOSTS: "127.0.0.1,localhost"
      # For your access proxy, add its hostname above and exact HTTPS origin below.
      CONVERTER_PUBLIC_ORIGINS: ""
    volumes:
      - converter-temp:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
volumes:
  converter-temp:
